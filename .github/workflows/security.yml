name: Security Checks

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run repository secret scanner
        run: python security_checks.py
